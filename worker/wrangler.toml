# Top-level = personal instance (timetracker.sabit.dev).
# Demo instance = `npx wrangler deploy --env demo` (cf-timetracker.pages.dev).
# Secrets are per worker: GAS_SECRET (Sheets sync), GEMINI_API_KEY (voice),
# APP_TOKEN (optional; native clients must send X-App-Token).
name = "timetracker-api"
main = "src/index.js"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "timetracker"
database_id = "d3352438-a6ce-41b5-8844-e7851e630524"

[vars]
ALLOWED_ORIGINS = "https://timetracker.sabit.dev,https://timetracker-8ss.pages.dev"
DEMO_MODE = "false"

[env.demo]
name = "cf-timetracker-api"

[env.demo.vars]
ALLOWED_ORIGINS = "*"
DEMO_MODE = "true"

[[env.demo.d1_databases]]
binding = "DB"
database_name = "cf-timetracker"
database_id = "f0f53836-cfc8-458a-87e0-885f553cc774"
