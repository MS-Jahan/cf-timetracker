name: Deploy demo

# Auto-deploy the live demo on every push to main:
#   Worker -> cf-timetracker-api.ssarwarjahan.workers.dev
#   Pages  -> cf-timetracker.pages.dev
# The Pages Git integration is taken by the personal Cloudflare account
# (one repo, one account), so the demo deploys through wrangler in CI.
# Requires repo secrets:
#   CLOUDFLARE_API_TOKEN  - API token on the contact@sabit.dev account with
#                           Workers Scripts:Edit, Cloudflare Pages:Edit, D1:Edit
#   CLOUDFLARE_ACCOUNT_ID - account id of the contact@sabit.dev account

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'web/**'
      - 'db/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  deploy-worker:
    name: Deploy demo Worker API
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: worker

      - name: Deploy Worker (demo instance)
        run: npx wrangler deploy --env demo
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-web:
    name: Deploy demo Pages frontend
    runs-on: ubuntu-latest
    needs: deploy-worker
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Build frontend
        run: npm run build
        working-directory: web
        env:
          # Baked in at build time, see docs/2026-09-20-demo-deploy.md
          VITE_API_BASE: https://cf-timetracker-api.ssarwarjahan.workers.dev

      - name: Remove stale Workers-assets deploy config
        run: rm -rf .wrangler dist/wrangler.json
        working-directory: web

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name cf-timetracker --force
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
