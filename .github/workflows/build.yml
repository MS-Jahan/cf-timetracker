name: Build Flutter Apps

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/timetracker/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/timetracker/**'
  workflow_dispatch:
    inputs:
      build_platform:
        description: 'Platform to build (all, android, linux, windows)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - android
          - linux
          - windows

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.24.0'
  JAVA_VERSION: '17'

jobs:
  # Android Build
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 25  # Android builds typically take 15-20 min
    if: |
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.build_platform == 'all' ||
      github.event.inputs.build_platform == 'android'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: 'flutter-${{ env.FLUTTER_VERSION }}'

      - name: Get dependencies
        working-directory: apps/timetracker
        run: flutter pub get

      - name: Run tests
        working-directory: apps/timetracker
        run: flutter test --test-randomize-ordering-seed=0
        timeout-minutes: 5  # Tests should complete quickly

      - name: Build Android APK (debug)
        working-directory: apps/timetracker
        run: flutter build apk --debug --dart-define=API_BASE_URL=https://api.example.com
        timeout-minutes: 15  # APK build typically takes 10-15 min

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: apps/timetracker/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7  # Keep for 7 days to save storage

      - name: Build Android App Bundle (release)
        working-directory: apps/timetracker
        run: flutter build appbundle --release --dart-define=API_BASE_URL=https://api.example.com
        timeout-minutes: 20  # AAB builds can take longer

      - name: Upload Android AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: apps/timetracker/build/app/outputs/bundle/release/app-release.aab
          retention-days: 7

  # Linux Build
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    timeout-minutes: 20  # Linux builds typically take 10-15 min
    if: |
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.build_platform == 'all' ||
      github.event.inputs.build_platform == 'linux'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libstdc++-12-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: 'flutter-${{ env.FLUTTER_VERSION }}-linux'

      - name: Get dependencies
        working-directory: apps/timetracker
        run: flutter pub get

      - name: Run tests
        working-directory: apps/timetracker
        run: flutter test --test-randomize-ordering-seed=0
        timeout-minutes: 5

      - name: Build Linux desktop
        working-directory: apps/timetracker
        run: flutter build linux --release --dart-define=API_BASE_URL=https://api.example.com
        timeout-minutes: 15

      - name: Create Linux archive
        run: |
          cd apps/timetracker/build/linux/x64/release/bundle
          tar -czf ../../../linux-bundle.tar.gz .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-bundle
          path: apps/timetracker/build/linux/linux-bundle.tar.gz
          retention-days: 7

  # Windows Build
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 25  # Windows builds typically take 15-20 min
    if: |
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.build_platform == 'all' ||
      github.event.inputs.build_platform == 'windows'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: 'flutter-${{ env.FLUTTER_VERSION }}-windows'

      - name: Get dependencies
        working-directory: apps/timetracker
        run: flutter pub get

      - name: Run tests
        working-directory: apps/timetracker
        run: flutter test --test-randomize-ordering-seed=0
        timeout-minutes: 5

      - name: Build Windows desktop
        working-directory: apps/timetracker
        run: flutter build windows --release --dart-define=API_BASE_URL=https://api.example.com
        timeout-minutes: 15

      - name: Create Windows archive
        run: |
          Compress-Archive -Path apps/timetracker/build/windows/x64/runner/Release/* -DestinationPath windows-build.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-build
          path: windows-build.zip
          retention-days: 7

  # Summary job
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-android, build-linux, build-windows]
    if: always()
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List artifacts
        run: |
          echo "📦 Build Artifacts:"
          echo "=================="
          find artifacts/ -type f -name "*.apk" -o -name "*.aab" -o -name "*.zip" -o -name "*.tar.gz" | while read file; do
            size=$(du -h "$file" | cut -f1)
            echo "  - $(basename $file) ($size)"
          done
          
          echo ""
          echo "🎯 Build Status:"
          echo "  - Android: ${{ needs.build-android.result == 'success' && '✅ Success' || needs.build-android.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }}"
          echo "  - Linux: ${{ needs.build-linux.result == 'success' && '✅ Success' || needs.build-linux.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }}"
          echo "  - Windows: ${{ needs.build-windows.result == 'success' && '✅ Success' || needs.build-windows.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }}"

      - name: Comment on PR with build status
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const androidStatus = '${{ needs.build-android.result }}' === 'success' ? '✅' : '${{ needs.build-android.result }}' === 'skipped' ? '⏭️' : '❌';
            const linuxStatus = '${{ needs.build-linux.result }}' === 'success' ? '✅' : '${{ needs.build-linux.result }}' === 'skipped' ? '⏭️' : '❌';
            const windowsStatus = '${{ needs.build-windows.result }}' === 'success' ? '✅' : '${{ needs.build-windows.result }}' === 'skipped' ? '⏭️' : '❌';
            
            const body = `## 🚀 Flutter Build Results
            
            | Platform | Status | Artifact |
            |----------|--------|----------|
            | Android | ${androidStatus} | [Download](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) |
            | Linux | ${linuxStatus} | [Download](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) |
            | Windows | ${windowsStatus} | [Download](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) |
            
            **Build Time:** ~${{ github.run_attempt }} minutes
            **Triggered by:** @${{ github.actor }}
            
            ---
            *Artifacts are available for 7 days.*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
